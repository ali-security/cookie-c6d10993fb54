name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '13'

      - name: Pack tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: cookie-0.4.1.tgz
          if-no-files-found: error
