language: node_js
node_js:
  - "0.10"
  - "0.12"
  - "1.8"
  - "2.5"
  - "3.3"
  - "4.9"
  - "5.12"
  - "6.17"
  - "7.10"
  - "8.17"
  - "9.11"
  - "10.20"
  - "11.15"
  - "12.16"
  - "13.13"
dist: xenial
env:
  global:
    # Suppress Node.js 0.6 compile warnings
    - "CXXCOM='$CXX -o $TARGET -c $CXXFLAGS $CCFLAGS -Wno-unused-local-typedefs -Wno-maybe-uninitialized -Wno-narrowing -Wno-strict-overflow $_CCCOMCOM $SOURCES'"
cache:
  directories:
    - node_modules
matrix:
  include:
    # Node 0.6 and 0.8 ship an npm that can only negotiate TLS 1.0, which no
    # registry accepts any more, and nvm has no prebuilt Node 0.6 binary for
    # linux-x64. Both legacy legs therefore install the dependency tree with
    # Node 0.10's npm and run the whole suite with the legacy runtime itself:
    # 0.8.28 from the official tarball, 0.6.21 compiled from source.
    - node_js: "0.10"
      env: SEAL_LEGACY_NODE=0.8 SEAL_LEGACY_NODE_FULL=0.8.28
    - node_js: "0.10"
      env: SEAL_LEGACY_NODE=0.6 SEAL_LEGACY_NODE_FULL=0.6.21
      addons:
        apt:
          packages:
            - gcc-4.8
            - g++-4.8
            - python2.7
before_install:
  # Resolve devDependencies against the release-era registry snapshot
  - "npm config set registry https://:2020-04-22T03%3A23%3A57.297Z@time-machines-npm.sealsecurity.io/"
  # Provide the legacy runtime this leg runs its tests on
  - |
    if [ "$SEAL_LEGACY_NODE_FULL" = "0.8.28" ]; then
      curl -sSL https://nodejs.org/dist/v0.8.28/node-v0.8.28-linux-x64.tar.gz | tar -xz -C "$HOME"
      export SEAL_LEGACY_BIN="$HOME/node-v0.8.28-linux-x64/bin"
      "$SEAL_LEGACY_BIN/node" --version
    fi
  - |
    if [ "$SEAL_LEGACY_NODE_FULL" = "0.6.21" ]; then
      mkdir -p "$HOME/py2"
      ln -sf /usr/bin/python2.7 "$HOME/py2/python"
      export PATH="$HOME/py2:$PATH"
      export SEAL_LEGACY_BIN="$HOME/node06/bin"
      curl -sSL https://nodejs.org/dist/v0.6.21/node-v0.6.21.tar.gz | tar -xz -C /tmp
      # The redirect keeps V8's -Wnarrowing spam from blowing Travis's 4MB log
      # limit, which terminates the job; a failed compile prints the log tail
      # and leaves no node binary, so the version check below fails the step
      (
        set -e
        cd /tmp/node-v0.6.21
        export CC=gcc-4.8 CXX=g++-4.8
        ./configure --prefix="$HOME/node06" --without-ssl
        make -j2
        make install
      ) > /tmp/node06.log 2>&1 || { tail -100 /tmp/node06.log; false; }
      "$SEAL_LEGACY_BIN/node" --version
    fi
  - |
    # Setup utility functions
    function node_version_lt () {
      [[ "$(v "${SEAL_LEGACY_NODE:-$TRAVIS_NODE_VERSION}")" -lt "$(v "${1}")" ]]
    }
    function npm_module_installed () {
      npm -lsp ls | grep -Fq "$(pwd)/node_modules/${1}:${1}@"
    }
    function npm_remove_module_re () {
      node -e '
        fs = require("fs");
        p = JSON.parse(fs.readFileSync("package.json", "utf8"));
        r = RegExp(process.argv[1]);
        for (k in p.devDependencies) {
          if (r.test(k)) delete p.devDependencies[k];
        }
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
      ' "$@"
    }
    function npm_use_module () {
      node -e '
        fs = require("fs");
        p = JSON.parse(fs.readFileSync("package.json", "utf8"));
        p.devDependencies[process.argv[1]] = process.argv[2];
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
      ' "$@"
    }
    function v () {
      tr '.' '\n' <<< "${1}" \
        | awk '{ printf "%03d", $0 }' \
        | sed 's/^0*//'
    }
  # Configure npm
  - |
    # Skip updating shrinkwrap / lock
    npm config set shrinkwrap false
  - |
    # Remove benchmark dependencies
    npm_remove_module_re '(^|-)benchmark$'
  # Setup Node.js version-specific dependencies
  - |
    # Configure eslint for linting
    if node_version_lt '8.0'; then npm_remove_module_re '^eslint(-|$)'
    fi
  - |
    # Configure mocha for testing
    if   node_version_lt '0.8' ; then npm_use_module 'mocha' '1.21.5'
    elif node_version_lt '0.10'; then npm_use_module 'mocha' '2.5.3'
    elif node_version_lt '4.0' ; then npm_use_module 'mocha' '3.5.3'
    elif node_version_lt '6.0' ; then npm_use_module 'mocha' '5.2.0'
    elif node_version_lt '8.0' ; then npm_use_module 'mocha' '6.2.2'
    fi
  - |
    # Configure nyc for testing
    if   node_version_lt '0.10'; then npm_remove_module_re '^nyc$'
    elif node_version_lt '4.0' ; then npm_use_module 'nyc' '10.3.2'
    elif node_version_lt '6.0' ; then npm_use_module 'nyc' '11.9.0'
    elif node_version_lt '8.0' ; then npm_use_module 'nyc' '14.1.1'
    fi
  # Update Node.js modules
  - |
    # Prune & rebuild node_modules
    if [[ -d node_modules ]]; then
      npm prune
      npm rebuild
    fi
before_script:
  - |
    # Contents of node_modules
    npm -s ls ||:
script:
  - |
    # Legacy legs run the full mocha suite on the legacy runtime; the rest run
    # the project's own test script, depending on nyc install
    if [[ -n "$SEAL_LEGACY_BIN" ]]; then
      "$SEAL_LEGACY_BIN/node" node_modules/mocha/bin/_mocha --reporter spec --bail --check-leaks --ui qunit test/
    elif npm_module_installed 'nyc'; then npm run-script test-ci
    else npm test
    fi
  - |
    # Run linting, if eslint exists
    if npm_module_installed 'eslint'; then npm run-script lint
    fi
